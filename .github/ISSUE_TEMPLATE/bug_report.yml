name: Bug report
description: Report an installation, pet-pack, Web UI, or desktop-companion problem.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, personal paths, or session logs."
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: "0.1.1-rc.2"
    validations:
      required: true
  - type: input
    id: pet-version
    attributes:
      label: dsh-pet bundle version
      placeholder: "@luv1211/dsh-pet-desktop@0.1.1-rc.3"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Installation or profile loading
        - Settings or Web UI
        - Custom pet pack
        - Electron desktop companion
        - Terminal host
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include safe, minimal reproduction steps and expected behavior.
    validations:
      required: true
