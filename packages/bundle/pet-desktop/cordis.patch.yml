- insert:
    # The desktop-companion service the `pet` row registers its draggable
    # window against. It must load before `pet`, whose apply reads
    # `ctx.get('desktopCompanion')` at plugin-load time; a later or absent row
    # leaves the service undefined and the companion window never appears.
    # Declared a dependency of this bundle (not a peer) so profiles that add
    # `dsh-pet-desktop` actually install it.
    - id: desktop-companion
      name: '@luv061211/dsh-desktop-companion'

    - id: pet
      name: '@luv061211/dsh-pet'

    - id: command-pet
      name: '@luv061211/dsh-command-pet'

    - id: ui-pet
      name: '@luv061211/dsh-client-ui-pet'
